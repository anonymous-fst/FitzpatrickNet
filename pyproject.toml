[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name        = "fst-classification"
version     = "1.0.0"
description = "Multimodal Fitzpatrick Skin Type classification with ITA fusion (ViT and CNN)"
readme      = "README.md"
requires-python = ">=3.10"
license     = { text = "MIT" }

keywords = [
    "fitzpatrick", "skin-type", "dermatology",
    "vision-transformer", "ITA", "multimodal",
]

# ── Runtime dependencies ──────────────────────────────────────────────────────
# Pin major versions only; exact versions are recorded in requirements.txt
# so that HPC environments can reproduce the exact training environment.
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "Pillow>=10.0",
    "tqdm>=4.65",
    "kneed>=0.8",
    "joblib>=1.3",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
]

# ── Optional dependencies ─────────────────────────────────────────────────────
[project.optional-dependencies]
optuna = ["optuna>=3.3"]
dev    = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

# ── Entry points ──────────────────────────────────────────────────────────────
[project.scripts]
fst-train-vit = "train_eval_vit_ita:main"
fst-train-cnn = "train_eval_cnn_ita:main"

# ── Package discovery ─────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["."]
include = ["fst*"]

# ── Ruff linter configuration ─────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select  = ["E", "F", "W", "I"]
ignore  = [
    "E501",   # line-length enforced by formatter, not linter
    "F401",   # unused imports acceptable in __init__.py re-exports
]

# ── Pytest configuration ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
